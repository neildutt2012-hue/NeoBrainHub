<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoBrainHub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
    }
    header {
      padding: 40px;
      text-align: center;
      background: #111;
      border-bottom: 2px solid #222;
    }
    header h1 {
      font-size: 3rem;
      color: #00aaff;
      letter-spacing: 2px;
    }
    .tagline {
      margin-top: 10px;
      font-size: 1.2rem;
      color: #ccc;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #111;
      border-radius: 12px;
      border: 1px solid #222;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.2);
    }
    h2 {
      text-align: center;
      color: #00aaff;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 1.1rem;
    }
    table th, table td {
      padding: 14px;
      text-align: center;
      border: 1px solid #222;
    }
    table th {
      background: #00aaff33;
      color: #00aaff;
      font-weight: bold;
    }
    table tr:hover {
      background: #00aaff22;
      transition: 0.3s;
    }
    .contact {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      border-top: 1px solid #222;
    }
    .whatsapp {
      font-size: 1.5rem;
      color: #25D366;
      font-weight: bold;
    }
    .note {
      margin-top: 10px;
      color: #ccc;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>NeoBrainHub</h1>
    <div class="tagline">Worldwide Weekend Tutoring • Kindergarten to Grade 5 • Math • English • Science</div>
  </header>

  <div class="container">
    <h2>Session Pricing</h2>
    <table>
      <tr>
        <th>Session Length</th>
        <th>Price (CAD)</th>
      </tr>
      <tr>
        <td>30 Minutes</td>
        <td>$10 CAD</td>
      </tr>
      <tr>
        <td>1 Hour</td>
        <td>$20 CAD</td>
      </tr>
      <tr>
        <td>1 Hour 30 Minutes</td>
        <td>$25 CAD</td>
      </tr>
    </table>
  </div>

  <div class="contact">
    <div class="whatsapp">WhatsApp: +1 604‑791‑4896</div>
    <div class="note">Available worldwide • Weekend classes only • Homework help included</div>
  </div>
</body>
</html>
